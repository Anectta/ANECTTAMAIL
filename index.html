<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anectta MAIL</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var lightIds = ['slate-teal', 'creme-sage', 'gray-indigo', 'offwhite-coral', 'lavender-purple', 'royal-cyan', 'red-offwhite'];
          var skin = localStorage.getItem('anectta_active_skin') || 'executive-midnight';
          var isLight = lightIds.indexOf(skin) !== -1;
          var root = document.documentElement;
          root.setAttribute('data-theme', skin);
          root.style.colorScheme = isLight ? 'light' : 'dark';
          if (isLight) {
            root.classList.remove('dark');
            root.classList.add('clean-white');
          } else {
            root.classList.add('dark');
            root.classList.remove('clean-white');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
